# dsh-plugin-unica — cordis patch layer.
#
# Mounts the unica MCP server as native DSH tools. Its eleven tools (Unica 0.13)
# reach the model as `mcp__unica__<raw name with dots replaced by underscores>_<hash12>`,
# for example `unica.view` -> `mcp__unica__unica_view_6f3a42290cc8`.
#
# PLUGIN_ROOT and DSH_HOME are substituted by install.mjs, which writes the
# resolved absolute paths into the generated patch. They are not DSH variables:
# cordis patch files evaluate `!!js` expressions but have no plugin-root
# interpolation, so the installer bakes the location in.

- insert:
    # ── the MCP bridge ──────────────────────────────────────────────────────
    # `command` is the port's Node launcher, NOT the server. The launcher verifies
    # the pinned runtime against runtime-manifest.json (archive + per-file
    # SHA-256), publishes it into the cache atomically, and then execs `unica`.
    # Upstream 0.13 ships no per-platform bootstrap binary, which is why this is
    # Node: DSH already requires it and the port then carries no prebuilt binaries.
    - id: mcp-unica
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: unica
        transport: stdio
        command: 'node'
        args:
          - 'PLUGIN_ROOT\bootstrap\launch.mjs'
          - 'PLUGIN_ROOT'
        # The runtime cache and the server daemon's state root. The launcher reads
        # both from the environment and would otherwise fall back to $DSH_HOME;
        # pinning them keeps a session out of a Codex or Claude Code install that
        # happens to share the machine.
        env:
          UNICA_RUNTIME_CACHE_DIR: 'DSH_HOME\unica\runtimes'
          UNICA_PROVIDER_STATE_DIR: 'DSH_HOME\unica\provider-state'
        # The core transfer happens inside MCP startup. Without this the session
        # still starts and only this server's tools are missing, which is much
        # harder to diagnose than a refused boot.
        failOnStartupError: true
        toolCallTimeoutMs: 600000

    # ── bundled skills ──────────────────────────────────────────────────────
    # Only needed for Web-GUI sessions: the shipped `standard` agent preset owns
    # its own skill-filesystem row and disables the host-plane one, so a plain
    # profile patch never reaches a session running on that preset. For headless
    # and TUI profiles — and for Web profiles served by a preset that inherits
    # the host root — installing into $DSH_HOME/skills or <project>/.dsh/skills
    # is enough and this row can be deleted.
    - id: skill-filesystem-unica
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: unica-plugin
        includeDefaultRoots: false
        customSkillDirs:
          - 'PLUGIN_ROOT\skills'
        watch: false
