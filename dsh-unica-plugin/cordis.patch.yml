# dsh-plugin-unica — cordis patch layer.
#
# Mounts the native unica bridge. Its eleven tools reach the model as
# `mcp__unica__<raw name with dots replaced by underscores>_<hash12>`,
# for example `unica.view` -> `mcp__unica__unica_view_6f3a42290cc8`.
#
# PLUGIN_ROOT and DSH_HOME are substituted by install.mjs, which writes the
# resolved absolute paths into the generated patch. They are not DSH variables:
# cordis patch files evaluate `!!js` expressions but have no plugin-root
# interpolation, so the installer bakes the location in. This file is the shape
# for a manual install; `install.mjs` writes a proper `file:///` URL, which is
# the portable form on Windows as well.

- insert:
    # ── the native bridge ───────────────────────────────────────────────────
    # `name` points at this plugin's Host entry, so the loader imports it from
    # disk and no package has to be installed into the profile. Every tool call
    # resolves its working directory from the calling DSH session and starts (or
    # reuses) one unica process for that directory — there is no workspace pin.
    - id: unica-native
      name: 'file:///PLUGIN_ROOT/host/index.js'
      config:
        pluginRoot: 'PLUGIN_ROOT'
        runtimeCacheDir: 'DSH_HOME/unica/runtimes'
        providerStateDir: 'DSH_HOME/unica/provider-state'
        maxProcesses: 4
        idleMs: 600000
        toolCallTimeoutMs: 600000

    # ── bundled skills ──────────────────────────────────────────────────────
    # Only needed for Web-GUI sessions: the shipped `standard` agent preset owns
    # its own skill-filesystem row and disables the host-plane one, so a plain
    # profile patch never reaches a session running on that preset. For headless
    # and TUI profiles — and for Web profiles served by a preset that inherits
    # the host root — installing into $DSH_HOME/skills or <project>/.dsh/skills
    # is enough and this row can be deleted.
    - id: skill-filesystem-unica
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: unica-plugin
        includeDefaultRoots: false
        customSkillDirs:
          - 'PLUGIN_ROOT/skills'
        watch: false
