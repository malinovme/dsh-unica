name: Published release upgrade
run-name: Verify upgrade from ${{ inputs.from_tag || 'Latest' }} to ${{ inputs.to_tag || 'checkout' }}

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'dsh-unica-plugin/install.mjs'
      - 'dsh-unica-plugin/installer/**'
      - 'dsh-unica-plugin/package.mjs'
      - '.github/workflows/published-upgrade.yml'
      - 'ci/published-upgrade.py'
  workflow_dispatch:
    inputs:
      from_tag:
        description: Installed published tag (defaults to Latest)
        type: string
        required: false
      to_tag:
        description: Target published tag (leave empty to build the checkout)
        type: string
        required: false

      checkout_installer:
        description: Test the checked-out installer for the target release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install DSH for Web profile composition
        shell: bash
        run: npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/dsh-harness" @deepseek-ai/dsh@0.2.2-rc.1
      - name: Resolve latest published baseline
        if: ${{ !inputs.from_tag }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/malinovme/dsh-unica/releases/latest --jq .tag_name)
          echo "LATEST_TAG=$tag" >> "$GITHUB_ENV"
      - name: Check upgrade and rollback
        env:
          CHECKOUT_INSTALLER: ${{ inputs.checkout_installer && '1' || '0' }}
          FROM_TAG: ${{ inputs.from_tag }}
          TO_TAG: ${{ inputs.to_tag }}
          DSH_INSTALL_ROOT: ${{ runner.temp }}/dsh-harness
        run: python ci/published-upgrade.py
