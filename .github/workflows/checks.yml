name: checks

# Runs the port's integrity checks and guards the two contracts that are easy to
# break silently: the skills/references pairing and the bootstrap binary modes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The checks that need no upstream payload: they read only what is committed.
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 26 skills cite ../../references/...; this proves every citation resolves
      # to a file that is actually committed. Regenerating skills after an
      # upstream bump is exactly when this breaks.
      - name: Reference citations resolve
        working-directory: dsh-unica-plugin
        run: node tools/check-refs.mjs .

      # The skills are almost entirely Russian prose. A bad UTF-8 round-trip in
      # any copy step turns them into mojibake, which no other check would catch.
      - name: No mojibake in ported files
        working-directory: dsh-unica-plugin
        run: node tools/check-encoding.mjs skills references

      # Documentation numbers must match the shipped catalog, or the README
      # starts lying about the tool surface.
      - name: Tool surface summary
        working-directory: dsh-unica-plugin
        run: node tools/surface-summary.mjs .

      # The port's own corrections to upstream skill text live in a table inside
      # the generator. Losing one would be silent, so each is verified in the
      # output: present exactly once, after the routing section, and carrying
      # already-namespaced tool names.
      - name: Port corrections are present in the skills
        working-directory: dsh-unica-plugin
        run: node tools/check-port-notes.mjs

      # The workflow itself is a checked artifact. Two runs were lost to errors
      # this step names precisely: a mistyped key, or a job that asserts nothing.
      # js-yaml is installed into /tmp so the job leaves no node_modules behind.
      - name: Workflow definition is well formed
        run: |
          mkdir -p /tmp/ci-deps && cd /tmp/ci-deps
          npm init -y >/dev/null 2>&1
          npm install js-yaml --silent
          cd "$GITHUB_WORKSPACE"
          NODE_PATH=/tmp/ci-deps/node_modules node dsh-unica-plugin/tools/validate-workflow.mjs

      # CI has no DSH installed, so the shipped `standard` composition the preset
      # copies is absent. A stub template is created first and handed to every
      # installer call that builds a preset, which keeps the generator itself
      # under test instead of skipping the check that depends on it.
      - name: Create a stub preset template
        run: |
          cat > /tmp/ci-standard.cordis.yml <<'YAML'
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          YAML

      # Both rows of the plan on a real POSIX platform, which is the branch the
      # build machine cannot exercise: Git-bash does not start there.
      - name: Installer composes a plan (POSIX branch)
        working-directory: dsh-unica-plugin
        run: |
          node install.mjs --dsh-home /tmp/dsh-ci --target both --dry-run \
            --standard /tmp/ci-standard.cordis.yml

      - name: Installer builds a preset from the stub template
        working-directory: dsh-unica-plugin
        run: |
          node install.mjs --dsh-home /tmp/dsh-ci-preset --target preset \
            --standard /tmp/ci-standard.cordis.yml

      # Proves the generator appended its rows to the template instead of
      # replacing it, and that it emitted the rows it promises.
      - name: Generated preset keeps the template and adds both rows
        run: |
          preset=/tmp/dsh-ci-preset/.agent-presets/unica-1c/agent.cordis.yml
          test -f "$preset"
          for needle in \
            "id: persona" \
            "id: skill-filesystem" \
            "id: mcp-unica" \
            "id: skill-filesystem-unica" \
            "serverName: unica" \
            "UNICA_PROVIDER_STATE_DIR"
          do
            if ! grep -q "$needle" "$preset"; then
              echo "::error file=$preset::missing '$needle' in the generated preset"
              exit 1
            fi
          done
          echo "generated preset carries the template plus both injected rows"

      # The session rules injected into the persona suffix must survive as YAML,
      # not merely as text: a folded scalar that broke on indentation would parse
      # to the wrong thing and lose every rule without any error.
      - name: Generated preset parses and keeps the session rules
        working-directory: dsh-unica-plugin
        run: |
          npm install --prefix /tmp/ci-yaml js-yaml --silent
          node tools/check-preset.mjs \
            /tmp/dsh-ci-preset/.agent-presets/unica-1c/agent.cordis.yml \
            /tmp/ci-yaml/node_modules

      - name: Installer rejects an unsupported platform
        working-directory: dsh-unica-plugin
        run: |
          if node install.mjs --target profile --dry-run --platform freebsd 2>/dev/null; then
            echo "expected a non-zero exit for an unsupported platform" >&2
            exit 1
          fi

  # File modes are only real on a POSIX checkout. Windows git records every file
  # as 100644, so a contributor on Windows can silently drop the execute bit and
  # nothing local would notice; upstream launch.sh execs the bootstrap directly,
  # which needs it.
  posix-modes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unix bootstrap binaries and launch.sh are executable
        run: |
          fail=0
          for f in \
            dsh-unica-plugin/bootstrap/launch.sh \
            dsh-unica-plugin/bootstrap/bin/darwin-arm64/unica-bootstrap \
            dsh-unica-plugin/bootstrap/bin/linux-x64/unica-bootstrap
          do
            if [ ! -x "$f" ]; then echo "::error file=$f::not executable"; fail=1; fi
          done
          exit $fail

      - name: The Windows launcher is not marked executable
        run: |
          if [ -x dsh-unica-plugin/bootstrap/bin/win-x64/unica-bootstrap.exe ]; then
            echo "::error::unica-bootstrap.exe unexpectedly has the execute bit"
            exit 1
          fi
